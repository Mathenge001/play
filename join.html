<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080914"><title>Join game • PartyPlay</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/platform.css"></head>
<body class="join-page"><main class="join-shell"><a class="brand join-brand" href="index.html"><span class="brand-mark">P</span><span>PartyPlay</span></a>
<section id="joinFormCard" class="join-card"><div class="join-icon">⚡</div><h1>Join a live game</h1><p>Enter the room code shown by the host. No account needed.</p><form id="joinForm"><label class="field"><span>Game code</span><input id="roomCode" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="8K4P2" required></label><label class="field"><span>Your name</span><input id="playerName" maxlength="28" autocomplete="nickname" placeholder="Lorna" required></label><label class="field"><span>Join as</span><select id="joinRole"><option value="player">Player</option><option value="display">TV / display</option><option value="audience">Audience / spectator</option></select></label><div id="teamPicker" class="field hidden"><span>Team</span><select id="teamSelect"></select></div><button class="btn primary full" type="submit">Join game →</button><p id="joinError" class="form-error" role="alert"></p></form></section>
<section id="playerController" class="controller-card hidden"><div class="controller-top"><span id="controllerRoom" class="tag live">ROOM</span><span id="connectionState">Connected</span></div><div id="controllerWaiting" class="controller-wait"><div class="pulse-orb">P</div><h2>You're in.</h2><p>Waiting for the host to start the next round.</p></div><div id="controllerRound" class="hidden"><div id="controllerMeta" class="round-meta"></div><h1 id="controllerPrompt"></h1><div id="controllerWager" class="controller-wager hidden"><span>Confidence wager</span><div id="controllerWagerChoices" class="wager-choices"></div><small>Virtual game points only.</small></div><div id="controllerInteraction" class="controller-interaction"></div><div id="controllerLocked" class="locked-state hidden"><div>🔒</div><h2>Answer locked</h2><p id="lockedTime"></p></div></div><div id="controllerResult" class="controller-result hidden"><span id="resultMark">✓</span><h2 id="resultTitle">Correct!</h2><p id="resultDetail"></p></div><div class="controller-score"><span>Your score</span><b id="controllerScore">0</b></div></section>
</main><script src="js/content.js"></script><script src="js/core.js"></script><script src="js/live-client.js"></script><script src="js/join.js"></script></body></html>
